# Canlı ortam: docker compose up -d --build   (önce .env dosyasını hazırlayın)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: [media:/app/media]
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "run_jobs", "--loop", "--interval", "20"]
    depends_on:
      db: {condition: service_healthy}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on: [web]
volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
