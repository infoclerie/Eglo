# Canlı ortam: docker compose up -d --build   (önce .env dosyasını hazırlayın)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
  media-init:   # fotoğraf klasörünün sahibini uygulama kullanıcısı yapar (her açılışta, saniyeler sürer)
    image: busybox:1.36
    command: ["sh", "-c", "mkdir -p /m /b && chown -R 1000:1000 /m /b"]
    volumes: [media:/m, appbackups:/b]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
      media-init: {condition: service_completed_successfully}
    volumes: [media:/app/media, appbackups:/app/backups_app]
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "run_jobs", "--loop", "--interval", "20"]
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
      media-init: {condition: service_completed_successfully}
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes: [./deploy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config, media:/srv/media:ro]
    depends_on: [web]
volumes:
  pgdata:
  media:
  appbackups:
  caddy_data:
  caddy_config:
